name: Build and Push Docker Image

# Pushes to main publish :edge (unreleased work). Pushing a version tag like v0.8.0 publishes
# :0.8.0, :0.8 and :latest, then creates the GitHub Release from that version's CHANGELOG section.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Create GitHub Releases
      packages: write # Push images to ghcr.io

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # A release tag must match the version in both package.json files, so the image, the
      # footer version and the Release never disagree
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          BACKEND="v$(node -p "require('./backend/package.json').version")"
          FRONTEND="v$(node -p "require('./frontend/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$BACKEND" ] || [ "$GITHUB_REF_NAME" != "$FRONTEND" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match backend $BACKEND / frontend $FRONTEND. Bump package.json first."
            exit 1
          fi

      # Work out the image tags: :edge for main, :X.Y.Z, :X.Y and :latest for releases, :sha-<commit> for every build
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/maximilian118/automatarr
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          flavor: |
            latest=auto

      # Enable QEMU for cross-platform builds (arm64 on amd64 runner)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for multi-platform image builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with GitHub Container Registry
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push multi-platform Docker image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create the GitHub Release with this version's section of CHANGELOG.md as its notes
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v version="## $GITHUB_REF_NAME" '
            $0 == version { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No '## $GITHUB_REF_NAME' section found in CHANGELOG.md." > release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" --title "Automatarr $GITHUB_REF_NAME" --notes-file release-notes.md
